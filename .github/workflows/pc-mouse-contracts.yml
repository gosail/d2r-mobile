name: PC mouse/controls static contracts

on:
  pull_request:
    paths:
      - "dm/host/**"
      - "dm/ios/**"
      - "dm/android/**"
      - ".github/workflows/pc-mouse-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Keyboard/controller options and runtime mouse contracts
        run: |
          python -m unittest discover -v -s dm/ios/tests -p test_controls_tab.py
          python -m unittest discover -v -s dm/ios/tests -p test_mouse_pc_parity.py
          python -m unittest discover -v -s dm/ios/tests -p test_mouse_world_render.py
          python -m unittest discover -v -s dm/ios/tests -p test_keyboard_bindings.py
      - name: Compile and run portable keyboard mapping unit test
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -pthread -I dm/host dm/host/dm_kbmap.c dm/host/tests/t_kbmap.c -o /tmp/dm_test_keyboard
          /tmp/dm_test_keyboard

  apple-syntax:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: macOS AppKit mouse overlay syntax
        run: |
          xcrun clang -fobjc-arc -fsyntax-only -Werror=implicit-function-declaration -mmacosx-version-min=15.0 -I dm/host -I dm/ios/Sources -I dm/gfx/nvn/include dm/host/front_mac.m
      - name: iPadOS UIKit mouse overlay syntax
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -fobjc-arc -fsyntax-only -Werror=implicit-function-declaration -miphoneos-version-min=16.0 -I dm/host -I dm/ios/Sources -I dm/gfx/nvn/include dm/ios/Sources/front_ios.m
